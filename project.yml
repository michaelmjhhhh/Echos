name: Echo
options:
  bundleIdPrefix: com.michael
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  minimumXcodeGenVersion: "2.45.3"
  postGenCommand: scripts/restore-package-lock.sh

packages:
  ArgmaxOSS:
    url: https://github.com/argmaxinc/argmax-oss-swift.git
    exactVersion: 0.18.0

targets:
  Echo:
    type: application
    platform: macOS
    sources:
      - Echo
    dependencies:
      - package: ArgmaxOSS
        product: WhisperKit
    info:
      path: Echo/Info.plist
      properties:
        CFBundleDisplayName: Echo
        CFBundleShortVersionString: "0.4.0"
        CFBundleVersion: "4"
        CFBundleIconFile: AppIcon
        ATSApplicationFontsPath: "."
        NSMicrophoneUsageDescription: Echo listens while you hold the dictation key so it can transcribe your speech on-device.
        LSApplicationCategoryType: public.app-category.productivity
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.michael.echo
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "58CFF4AB255CBC0E7972D18C3AC0739DFCD3B9F9"
        ENABLE_HARDENED_RUNTIME: NO
        ENABLE_APP_SANDBOX: NO
        SWIFT_VERSION: "5.9"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        GENERATE_INFOPLIST_FILE: NO
        COMBINE_HIDPI_IMAGES: YES

  EchoEvaluate:
    type: tool
    platform: macOS
    sources:
      - tools/EchoEvaluate.swift
      - Echo/Transcription/TranscriptionService.swift
      - Echo/Transcription/TranscriptionResult.swift
      - Echo/Transcription/WhisperModelCatalog.swift
      - Echo/Transcription/ModelAcquisition.swift
      - Echo/Transcription/LocalWhisperTokenizer.swift
      - Echo/Audio/CaptureConfiguration.swift
      - Echo/Audio/CapturedAudio.swift
      - Echo/Audio/VoiceActivityTrimmer.swift
      - Echo/Processing
    dependencies:
      - package: ArgmaxOSS
        product: WhisperKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.michael.echo.evaluate
        SWIFT_VERSION: "5.9"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        CODE_SIGNING_ALLOWED: NO
        GENERATE_INFOPLIST_FILE: NO

  EchoTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - EchoTests
    dependencies:
      - target: Echo
    settings:
      base:
        CODE_SIGN_IDENTITY: "58CFF4AB255CBC0E7972D18C3AC0739DFCD3B9F9"
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Echo.app/Contents/MacOS/Echo"
        BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  Echo:
    build:
      targets:
        Echo: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - EchoTests

  EchoEvaluate:
    build:
      targets:
        EchoEvaluate: all
    run:
      config: Release
