name: Validate

on:
  push:
    branches: [main]
    paths-ignore: ["**/*.md", "docs/**", "LICENSE"]
  pull_request:
    paths-ignore: ["**/*.md", "docs/**", "LICENSE"]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

# A new push to a PR cancels its older run; main and release runs always finish.
concurrency:
  group: validate-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    runs-on: macos-26
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.5.app/Contents/Developer
      ECHO_ASR_SMOKE: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Cache ASR smoke model
        uses: actions/cache@v4
        with:
          path: build/ci/model-cache
          key: asr-smoke-model-openai_whisper-tiny.en-${{ hashFiles('config/Package.resolved') }}
      - name: Build, existing checks, and owned audio replay
        run: scripts/ci.sh
      - name: Upload content-free evaluation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: replay-reports
          path: build/ci/replay-*.json
          if-no-files-found: ignore
